name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  UPSTREAM_TAG: "5.8.7"
  COMFYUI_VERSION: "0.34.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Clone upstream worker-comfyui @ ${{ env.UPSTREAM_TAG }}
        run: git clone --depth 1 --branch "${{ env.UPSTREAM_TAG }}" https://github.com/runpod-workers/worker-comfyui upstream

      - name: Apply patches
        run: |
          python3 patch_handler.py upstream/handler.py
          python3 patch_dockerfile.py upstream/Dockerfile
          cat extra_model_paths.append.yaml >> upstream/src/extra_model_paths.yaml
          echo "--- patched extra_model_paths.yaml ---"
          cat upstream/src/extra_model_paths.yaml

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # target=base: full worker, no baked models (weights live on the network
      # volume). COMFYUI_VERSION >= 0.30.0 is what brings the native MiniMax H3
      # nodes; upstream's Dockerfile already mirrors deps into /opt/venv and
      # runs the CPU quick-test at build time, so a broken node graph fails HERE.
      - uses: docker/build-push-action@v6
        with:
          context: upstream
          target: base
          build-args: |
            COMFYUI_VERSION=${{ env.COMFYUI_VERSION }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v1
            ghcr.io/${{ github.repository }}:latest
